name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - master
    paths:
      - 'DailyDiction-Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DailyDiction-Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: DailyDiction-Frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://dailydiction.id/api/v1"

      - name: Copy Static Files to Public
        run: |
          mkdir -p public/_next
          cp -r .next/static public/_next/

      - name: Create Restart Trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: BRUTAL CLEANUP (Hapus File Gajah)
        run: rm -rf node_modules .git src README.md

      - name: SETUP KUNCI SSH NATIVE
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: UPLOAD RSYNC (Jalur Kuli Linux)
        run: |
          rsync -avz -e "ssh -p 22 -o StrictHostKeyChecking=no" ./ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home/dailydic/daily-frontend/
