name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - master
    paths:
      - 'DailyDiction-Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DailyDiction-Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Fix Teori Farhan)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: DailyDiction-Frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://dailydiction.id/api/v1"

      - name: Copy Static Files to Public
        run: |
          mkdir -p public/_next
          cp -r .next/static public/_next/

      - name: Create Restart Trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: BRUTAL CLEANUP (Hapus File Gajah)
        run: rm -rf node_modules .git src README.md

      - name: Install LFTP (Kendaraan Tempur)
        run: sudo apt-get install -y lftp

      - name: UPLOAD LEWAT LFTP (Anti Timeout Dewaweb)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${FTP_USER}","${FTP_PASS}" -e "set ftp:ssl-allow true; set ftp:ssl-force true; set ssl:verify-certificate no; mirror -R -v ./ ./; quit" ${FTP_HOST}
