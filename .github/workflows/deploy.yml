name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - master
    paths:
      - 'DailyDiction-Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DailyDiction-Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: DailyDiction-Frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://dailydiction.id/api/v1"

      - name: Copy Static Files to Public
        run: |
          mkdir -p public/_next
          cp -r .next/static public/_next/

      - name: Create Restart Trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: Debug - Check Secrets Exist
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "FTP_SERVER is EMPTY"; else echo "FTP_SERVER is SET"; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "FTP_USERNAME is EMPTY"; else echo "FTP_USERNAME is SET"; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "FTP_PASSWORD is EMPTY"; else echo "FTP_PASSWORD is SET"; fi

      - name: Sync Frontend to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./DailyDiction-Frontend/"
          server-dir: "/daily-frontend/"
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            README.md