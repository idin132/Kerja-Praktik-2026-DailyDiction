name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - master
    paths:
      - 'DailyDiction-Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DailyDiction-Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: DailyDiction-Frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://dailydiction.id/api/v1"

      - name: Copy Static Files to Public
        run: |
          mkdir -p public/_next
          cp -r .next/static public/_next/

      - name: Create Restart Trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: BRUTAL CLEANUP (Hapus File Gajah)
        run: rm -rf node_modules .git src README.md

      - name: UPLOAD SFTP (Saran Dewaweb Port 22)
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          privateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          localDir: './DailyDiction-Frontend'
          remoteDir: '/home/dailydic/daily-frontend'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            README.md
